<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1> HTML and CSS Quiz</h1>
        <form>
            <!--Question 1-->
            <label for="q1">1. What does HTML stand for?</label>
            <input type="text" id="q1" name="q1">
            
            <!--Question 2-->
            <label for="q2">2. In a few words,explain what CSS is used for.</label>
            <textarea id="q2" name="q2" rows="4"></textarea>

            <!--Question 3-->
            <label for="q3">3. Which HTML element is used to create a hyperlink?</label>
            <select id="q3" name="q3">
                <option value="" selected disabled> Choose one...</option>
                <option value="p">&lt;p&gt;</option>
                <option value="a">&lt;a&gt;</option>
                <option value="img">&lt;img&gt;</option>
            </select>
            <!--Question 4-->
            <label for="q4">4. How many heading levels does HTML have?</label>
            <input type="number" id="q4" name="q4" step="1">
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
